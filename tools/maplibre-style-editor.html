<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MapLibre Style Editor</title>
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css" rel="stylesheet">
<style>
  :root {
    --bg: #101418;
    --panel: #171c22;
    --panel2: #1d242c;
    --border: #2a333d;
    --text: #e6eaef;
    --muted: #8b97a5;
    --accent: #3b82f6;
    --danger: #ef4444;
    --ok: #22c55e;
    --warn: #f59e0b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
  }
  #app {
    display: grid;
    grid-template-rows: 48px 1fr 28px;
    height: 100vh;
  }
  header {
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
  }
  header h1 {
    font-size: 15px; margin: 0 12px 0 0; white-space: nowrap;
    font-weight: 600;
  }
  .spacer { flex: 1; }
  button, select, input, textarea {
    font: inherit; color: var(--text);
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 9px;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger:hover { border-color: var(--danger); color: var(--danger); }
  button.small { padding: 2px 7px; font-size: 12px; }
  #status {
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px; font-size: 12px; color: var(--muted);
    background: var(--panel); border-top: 1px solid var(--border);
    white-space: nowrap; overflow: hidden;
  }
  #status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex-shrink: 0; }
  #status .dot.err { background: var(--danger); }
  #status .dot.warn { background: var(--warn); }
  #status .count { margin-left: auto; }

  main {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr) minmax(0, 1fr);
    min-height: 0;
  }
  .col { display: flex; flex-direction: column; min-height: 0; }
  .col + .col { border-left: 1px solid var(--border); }

  /* left panel */
  #left { background: var(--panel); }
  .panel-title {
    padding: 8px 12px; font-size: 11px; font-weight: 700; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
  }
  .panel-title .spacer { flex: 1; }
  #topSettings { border-bottom: 1px solid var(--border); padding: 8px 12px; display: flex; flex-direction: column; gap: 6px; }
  .field { display: flex; flex-direction: column; gap: 3px; }
  .field label { font-size: 11px; color: var(--muted); }
  .field input, .field select, .field textarea { width: 100%; }
  #layerList { flex: 1; overflow: auto; }
  .layer-tools { display: flex; gap: 4px; padding: 8px 12px; flex-wrap: wrap; border-top: 1px solid var(--border); }
  .layer-item {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 12px; cursor: pointer; border-left: 3px solid transparent;
  }
  .layer-item:hover { background: var(--panel2); }
  .layer-item.selected { background: var(--panel2); border-left-color: var(--accent); }
  .layer-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    font-size: 10px; padding: 1px 6px; border-radius: 4px; flex-shrink: 0;
  }
  .badge.fill { background: #155e75; }
  .badge.line { background: #7c2d12; }
  .badge.symbol { background: #4a044e; }
  .badge.background { background: #374151; }
  .badge.other { background: #374151; }
  .eye { cursor: pointer; color: var(--muted); flex-shrink: 0; }
  .eye.off { opacity: .4; }

  /* center editor */
  #center { overflow: auto; }
  #layerMeta { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; flex-wrap: wrap; gap: 8px; }
  #layerMeta .field { flex: 1 1 130px; }
  .section {
    border-bottom: 1px solid var(--border);
  }
  .section > .head {
    padding: 7px 14px; display: flex; align-items: center; gap: 8px;
    cursor: pointer; font-weight: 600;
  }
  .section > .head .toggle { color: var(--muted); }
  .section > .head .spacer { flex: 1; }
  .section > .head .count { font-size: 11px; color: var(--muted); font-weight: 400; }
  .section .body { padding: 6px 14px 12px; }
  .section.collapsed .body { display: none; }
  .prop {
    display: grid; grid-template-columns: 150px minmax(0,1fr) 24px;
    align-items: center; gap: 8px; padding: 4px 0;
  }
  .prop .key {
    font-size: 12px; color: var(--muted);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .prop .ctrl { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .prop .ctrl input[type="text"], .prop .ctrl input[type="number"], .prop .ctrl select {
    width: 100%; min-width: 0;
  }
  .prop .ctrl input[type="range"] { flex: 1; min-width: 60px; }
  .prop .ctrl input[type="color"] { width: 44px; height: 28px; padding: 1px; flex-shrink: 0; }
  .prop .ctrl textarea { width: 100%; min-height: 60px; font-family: ui-monospace, monospace; font-size: 12px; resize: vertical; }
  .prop .ctrl input.err, .prop .ctrl textarea.err { border-color: var(--danger); }
  .prop .rm { background: transparent; border: none; color: var(--muted); cursor: pointer; padding: 0; }
  .prop .rm:hover { color: var(--danger); }
  .addrow { display: flex; gap: 6px; padding: 6px 0 2px; }
  .addrow select { flex: 1; }
  .inline-json {
    font-size: 11px; color: var(--muted); margin-top: 2px;
  }
  .inline-json input { width: 100%; font-family: ui-monospace, monospace; font-size: 12px; }

  /* preview */
  #previewCol { position: relative; }
  #preview { position: absolute; inset: 0; }
  #empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }

  /* modal */
  #modal {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center; z-index: 50;
  }
  #modal.open { display: flex; }
  #modal .box {
    width: min(720px, 90vw); max-height: 85vh;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    display: flex; flex-direction: column;
  }
  #modal .box .head { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; }
  #modal .box .head .spacer { flex: 1; }
  #modal textarea {
    flex: 1; min-height: 50vh; margin: 12px 14px; border-radius: 6px;
    font-family: ui-monospace, monospace; font-size: 12px; resize: vertical;
  }
  #modal .box .foot { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; }
  .hint { font-size: 11px; color: var(--muted); padding: 4px 14px; }
  .hint code { color: var(--text); }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>MapLibre Style Editor</h1>
    <button id="btnLoad">Load from URL</button>
    <button id="btnReset">Reset</button>
    <div class="spacer"></div>
    <button id="btnJson">View JSON</button>
    <button id="btnCopy">Copy JSON</button>
    <button id="btnDownload" class="primary">Download JSON</button>
  </header>

  <main>
    <div class="col" id="left">
      <div class="panel-title">Style settings</div>
      <div id="topSettings"></div>

      <div class="panel-title">
        Layers
        <span id="layerCount" style="font-weight:400;text-transform:none;letter-spacing:0;"></span>
      </div>
      <div id="layerList"></div>
      <div class="layer-tools">
        <button id="btnAdd" class="small">+ Add</button>
        <button id="btnDup" class="small">Duplicate</button>
        <button id="btnDel" class="small danger">Delete</button>
        <button id="btnUp" class="small">↑</button>
        <button id="btnDown" class="small">↓</button>
      </div>
    </div>

    <div class="col" id="center">
      <div id="layerMeta"></div>
      <div id="propSections"></div>
    </div>

    <div class="col" id="previewCol">
      <div id="preview"></div>
      <div id="empty">Loading map…</div>
    </div>
  </main>

  <div id="status">
    <span class="dot"></span>
    <span id="statusMsg">Loading…</span>
    <span class="count" id="statusCount"></span>
  </div>
</div>

<div id="modal">
  <div class="box">
    <div class="head">
      <strong>Style JSON</strong>
      <div class="spacer"></div>
      <button id="modalClose">Close</button>
    </div>
    <textarea id="jsonArea" spellcheck="false"></textarea>
    <div class="foot">
      <span class="hint" id="jsonErr" style="margin-right:auto;color:var(--danger);"></span>
      <button id="jsonApply">Apply</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
"use strict";

const DEFAULT_STYLE_URL = "https://api.protomaps.com/styles/v5/dark/en.json?key=73c45a97eddd43fb";
const DEFAULT_CENTER = [93.6, 27.08];
const DEFAULT_ZOOM = 7.5;

const $ = (s) => document.querySelector(s);
const $$ = (s) => Array.from(document.querySelectorAll(s));
const esc = (s) => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");

let style = null;
let selectedLayerId = null;
let searchText = "";
let typeFilter = "all";
let map = null;
let mapReady = false;
let debounceTimer = null;
let defaultStyle = null;

/* ---------- property metadata (style-spec-ish) ---------- */

const ENUMS = {
  "symbol-placement": ["point","line","line-center"],
  "text-anchor": ["center","left","right","top","bottom","top-left","top-right","bottom-left","bottom-right"],
  "text-justify": ["auto","left","right","center"],
  "text-transform": ["none","uppercase","lowercase"],
  "text-rotation-alignment": ["map","viewport","auto"],
  "icon-rotation-alignment": ["map","viewport","auto"],
  "icon-pitch-alignment": ["map","viewport","auto"],
  "text-pitch-alignment": ["map","viewport","auto"],
  "text-variable-anchor": ["center","left","right","top","bottom","top-left","top-right","bottom-left","bottom-right"],
  "visibility": ["visible","none"],
  "line-cap": ["butt","round","square"],
  "line-join": ["bevel","round","miter"],
};

const PAINT_DEFAULTS = {
  "fill-color": ["#888888","color"], "fill-opacity": [1,"number"], "fill-outline-color": ["#888888","color"],
  "fill-sort-key": [0,"number"], "fill-pattern": ["","text"],
  "line-color": ["#888888","color"], "line-opacity": [1,"number"], "line-width": [1,"number"],
  "line-gap-width": [0,"number"], "line-blur": [0,"number"], "line-offset": [0,"number"],
  "line-dasharray": ["","array"],
  "background-color": ["#333333","color"], "background-opacity": [1,"number"],
  "text-color": ["#ffffff","color"], "text-opacity": [1,"number"],
  "text-halo-color": ["rgba(0,0,0,1)","color"], "text-halo-width": [0,"number"], "text-halo-blur": [0,"number"],
  "icon-color": ["#ffffff","color"], "icon-opacity": [1,"number"],
  "icon-halo-color": ["rgba(0,0,0,1)","color"], "icon-halo-width": [0,"number"],
  "circle-radius": [5,"number"], "circle-color": ["#888888","color"], "circle-opacity": [1,"number"],
  "circle-stroke-color": ["#000000","color"], "circle-stroke-width": [0,"number"],
};

const LAYOUT_DEFAULTS = {
  "visibility": ["visible","enum"],
  "symbol-placement": ["point","enum"], "symbol-spacing": [250,"number"], "symbol-sort-key": [0,"number"],
  "text-field": ["","text"], "text-size": [16,"number"], "text-font": ["","array"],
  "text-anchor": ["center","enum"], "text-justify": ["auto","enum"], "text-transform": ["none","enum"],
  "text-letter-spacing": [0,"number"], "text-line-height": [1.2,"number"], "text-max-width": [10,"number"],
  "text-max-angle": [45,"number"], "text-rotate": [0,"number"], "text-padding": [2,"number"],
  "text-radial-offset": [0,"number"], "text-variable-anchor": ["","array"],
  "text-rotation-alignment": ["auto","enum"], "text-pitch-alignment": ["auto","enum"],
  "icon-image": ["","text"], "icon-size": [1,"number"], "icon-padding": [2,"number"],
  "icon-rotate": [0,"number"], "icon-rotation-alignment": ["auto","enum"], "icon-pitch-alignment": ["auto","enum"],
  "icon-text-fit": ["none","enum"], "line-cap": ["round","enum"], "line-join": ["round","enum"],
  "line-miter-limit": [2,"number"], "line-round-limit": [1.05,"number"],
};

function paintKeysFor(type) {
  const base = ["fill-color","fill-opacity","line-color","line-opacity","line-width",
    "background-color","background-opacity","text-color","text-halo-color","text-halo-width",
    "circle-color","circle-opacity","circle-radius"];
  return Object.keys(PAINT_DEFAULTS).filter(k => base.includes(k) || k.endsWith("-color") || k.endsWith("-opacity") || k.includes(type));
}
function layoutKeysFor(type) {
  return Object.keys(LAYOUT_DEFAULTS).filter(k => LAYOUT_DEFAULTS[k][1] === "enum" || true);
}

/* ---------- state helpers ---------- */

function deepCopy(o) { return JSON.parse(JSON.stringify(o)); }
function layerIndex(id) { return style.layers.findIndex(l => l.id === id); }
function selectedIndex() { return layerIndex(selectedLayerId); }

function status(msg, kind) {
  const dot = $("#status .dot");
  $("#statusMsg").textContent = msg;
  dot.className = "dot" + (kind === "err" ? " err" : kind === "warn" ? " warn" : "");
}

function schedulePreview() {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(updatePreview, 350);
}

function updatePreview() {
  if (!mapReady || !style) return;
  try {
    map.setStyle(deepCopy(style));
    status("Preview updated");
  } catch (e) {
    status("Style error: " + e.message, "err");
  }
}

/* ---------- rendering: top settings + sources ---------- */

function renderTopSettings() {
  const box = $("#topSettings");
  if (!style) { box.innerHTML = ""; return; }
  box.innerHTML = `
    <div class="field"><label>Name</label><input id="tName" value="${esc(style.name || "")}"></div>
    <div class="field"><label>Glyphs URL</label><input id="tGlyphs" value="${esc(style.glyphs || "")}"></div>
    <div class="field"><label>Sprite URL</label><input id="tSprite" value="${esc(style.sprite || "")}"></div>
    ${Object.entries(style.sources || {}).map(([id, src]) => `
      <div class="field"><label>Source · ${esc(id)}</label>
        <input class="src-url" data-id="${esc(id)}" value="${esc(src.url || "")}" placeholder="style URL">
        <input class="src-tiles" data-id="${esc(id)}" value="${esc((src.tiles || []).join("\n"))}" placeholder="tiles (one per line)">
        <input class="src-maxzoom" data-id="${esc(id)}" type="number" value="${esc(src.maxzoom ?? "")}" placeholder="maxzoom">
      </div>`).join("")}
  `;
  const onUrl = (e) => { const src = style.sources[e.target.dataset.id]; if (src) src.url = e.target.value || undefined; schedulePreview(); };
  const onTiles = (e) => { const src = style.sources[e.target.dataset.id]; if (src) { src.tiles = e.target.value.split("\n").map(s => s.trim()).filter(Boolean); schedulePreview(); } };
  const onMaxzoom = (e) => { const src = style.sources[e.target.dataset.id]; if (src) src.maxzoom = e.target.value === "" ? undefined : Number(e.target.value); schedulePreview(); };
  const onName = (e) => { style.name = e.target.value; };
  const onGlyphs = (e) => { style.glyphs = e.target.value; schedulePreview(); };
  const onSprite = (e) => { style.sprite = e.target.value; schedulePreview(); };
  $("#tName").oninput = onName;
  $("#tGlyphs").oninput = onGlyphs;
  $("#tSprite").oninput = onSprite;
  $$(".src-url").forEach(el => el.oninput = onUrl);
  $$(".src-tiles").forEach(el => el.oninput = onTiles);
  $$(".src-maxzoom").forEach(el => el.oninput = onMaxzoom);
}

/* ---------- rendering: layer list ---------- */

function renderLayerList() {
  const list = $("#layerList");
  if (!style) { list.innerHTML = ""; return; }
  const q = searchText.toLowerCase();
  const filtered = style.layers.filter(l =>
    (typeFilter === "all" || l.type === typeFilter) &&
    (!q || l.id.toLowerCase().includes(q))
  );
  $("#layerCount").textContent = `${filtered.length}/${style.layers.length}`;
  list.innerHTML = filtered.map(l => {
    const selected = l.id === selectedLayerId ? " selected" : "";
    const vis = (l.layout && l.layout.visibility === "none") ? " off" : "";
    return `<div class="layer-item${selected}" data-id="${esc(l.id)}">
      <span class="badge ${esc(l.type)}">${esc(l.type)}</span>
      <span class="name">${esc(l.id)}</span>
      <span class="eye${vis}" data-vis="${esc(l.id)}" title="Toggle visibility">👁</span>
    </div>`;
  }).join("");
  $$(".layer-item").forEach(el => el.onclick = () => selectLayer(el.dataset.id));
  $$(".eye").forEach(el => el.onclick = (e) => {
    e.stopPropagation();
    const l = style.layers.find(x => x.id === el.dataset.vis);
    if (!l) return;
    if (!l.layout) l.layout = {};
    l.layout.visibility = (l.layout.visibility === "none") ? "visible" : "none";
    renderLayerList();
    if (l.id === selectedLayerId) renderLayerMeta();
    schedulePreview();
  });
}

function selectLayer(id) {
  selectedLayerId = id;
  renderLayerList();
  renderLayerMeta();
  renderSections();
}

/* ---------- rendering: layer meta ---------- */

function renderLayerMeta() {
  const box = $("#layerMeta");
  const i = selectedIndex();
  if (i < 0) { box.innerHTML = '<div class="hint">Select a layer on the left to edit it.</div>'; return; }
  const l = style.layers[i];
  box.innerHTML = `
    <div class="field" style="flex:2"><label>ID</label><input id="mId" value="${esc(l.id)}"></div>
    <div class="field"><label>Type</label><select id="mType">${["background","fill","line","symbol","circle","raster","fill-extrusion","hillshade","heatmap"].map(t => `<option ${t===l.type?"selected":""}>${t}</option>`).join("")}</select></div>
    <div class="field"><label>Source</label><input id="mSource" value="${esc(l.source || "")}"></div>
    <div class="field"><label>Source-layer</label><input id="mSourcelayer" value="${esc(l["source-layer"] || "")}"></div>
    <div class="field"><label>Min zoom</label><input id="mMin" type="number" value="${esc(l.minzoom ?? "")}"></div>
    <div class="field"><label>Max zoom</label><input id="mMax" type="number" value="${esc(l.maxzoom ?? "")}"></div>
  `;
  $("#mId").onchange = (e) => { const old = l.id; l.id = e.target.value; selectedLayerId = l.id; renderLayerList(); status("Layer renamed: " + old + " → " + l.id); };
  $("#mType").onchange = (e) => { l.type = e.target.value; renderLayerList(); renderSections(); schedulePreview(); };
  $("#mSource").onchange = (e) => { l.source = e.target.value || undefined; schedulePreview(); };
  $("#mSourcelayer").onchange = (e) => { if (e.target.value) l["source-layer"] = e.target.value; else delete l["source-layer"]; schedulePreview(); };
  $("#mMin").onchange = (e) => { l.minzoom = e.target.value === "" ? undefined : Number(e.target.value); schedulePreview(); };
  $("#mMax").onchange = (e) => { l.maxzoom = e.target.value === "" ? undefined : Number(e.target.value); schedulePreview(); };
}

/* ---------- rendering: property sections ---------- */

function renderSections() {
  const box = $("#propSections");
  const i = selectedIndex();
  if (i < 0) { box.innerHTML = ""; return; }
  const l = style.layers[i];
  const paint = l.paint || {};
  const layout = l.layout || {};
  const filter = l.filter || null;

  box.innerHTML = `
    <div class="section" data-sec="filter">
      <div class="head"><span class="toggle">▾</span> Filter <span class="spacer"></span><span class="count">expression</span></div>
      <div class="body">
        <div class="prop" style="grid-template-columns:150px minmax(0,1fr);">
          <span class="key">filter</span>
          <div class="ctrl"><textarea id="pFilter" placeholder="null">${esc(JSON.stringify(filter ?? null, null, 1))}</textarea></div>
        </div>
      </div>
    </div>
    <div class="section" data-sec="layout">
      <div class="head"><span class="toggle">▾</span> Layout <span class="spacer"></span><span class="count">${Object.keys(layout).length} props</span></div>
      <div class="body">
        ${renderProps("layout", layout, l.type)}
        <div class="addrow">
          <select id="addLayout">
            <option value="">+ Add layout property…</option>
            ${layoutKeysFor(l.type).filter(k => !(k in layout)).map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join("")}
          </select>
          <button class="small" id="btnAddLayout">Add</button>
        </div>
      </div>
    </div>
    <div class="section" data-sec="paint">
      <div class="head"><span class="toggle">▾</span> Paint <span class="spacer"></span><span class="count">${Object.keys(paint).length} props</span></div>
      <div class="body">
        ${renderProps("paint", paint, l.type)}
        <div class="addrow">
          <select id="addPaint">
            <option value="">+ Add paint property…</option>
            ${paintKeysFor(l.type).filter(k => !(k in paint)).map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join("")}
          </select>
          <button class="small" id="btnAddPaint">Add</button>
        </div>
      </div>
    </div>
  `;

  $$(".section > .head").forEach(head => head.onclick = () => {
    head.parentElement.classList.toggle("collapsed");
    const t = head.querySelector(".toggle");
    if (t) t.textContent = head.parentElement.classList.contains("collapsed") ? "▸" : "▾";
  });

  const pf = $("#pFilter");
  pf.oninput = () => {
    try { const v = JSON.parse(pf.value); if (v === null) { delete l.filter; } else { l.filter = v; } pf.classList.remove("err"); schedulePreview(); }
    catch { pf.classList.add("err"); status("Invalid filter JSON", "err"); }
  };

  const la = $("#addLayout");
  la.onchange = () => { if (la.value) addProp("layout", la.value); };
  const pa = $("#addPaint");
  pa.onchange = () => { if (pa.value) addProp("paint", pa.value); };
  $("#btnAddLayout").onclick = () => { if (la.value) addProp("layout", la.value); };
  $("#btnAddPaint").onclick = () => { if (pa.value) addProp("paint", pa.value); };

  bindPropInputs();
}

function renderProps(section, obj, type) {
  return Object.entries(obj).map(([key, value]) => {
    return `<div class="prop" data-section="${section}" data-key="${esc(key)}">
      <span class="key" title="${esc(key)}">${esc(key)}</span>
      ${renderControl(section, key, value)}
      <button class="rm" data-rm="${esc(section)}:${esc(key)}" title="Remove">✕</button>
    </div>`;
  }).join("");
}

function isExpression(v) { return Array.isArray(v) && v.length > 0; }
function isFlatArray(v) { return Array.isArray(v) && v.every(x => typeof x === "string" || typeof x === "number" || typeof x === "boolean"); }

function controlType(section, key, value) {
  // A nested/expression value (or object) is always edited as raw JSON.
  if (isExpression(value) && !isFlatArray(value)) return "expr";
  const def = (section === "paint" ? PAINT_DEFAULTS : LAYOUT_DEFAULTS)[key];
  const base = def ? def[1] : null;
  if (base) {
    if (base === "color") return "color";
    if (base === "enum") return ENUMS[key] ? "enum" : "text";
    if (base === "number") return "number";
    if (base === "text") return "text";
    if (base === "array") return isFlatArray(value) ? "array" : "expr";
  }
  if (typeof value === "boolean") return "bool";
  if (typeof value === "number") return "number";
  if (typeof value === "string") {
    if (/^#|^rgba?\(/.test(value)) return "color";
    if (ENUMS[key]) return "enum";
    return "text";
  }
  return "expr";
}

function renderControl(section, key, value) {
  const t = controlType(section, key, value);
  const k = `${section}__${key}`;
  switch (t) {
    case "color": {
      const hex = /^#[0-9a-fA-F]{6}$/.test(value) ? value : "#888888";
      return `<div class="ctrl">
        <input type="color" data-k="${esc(k)}" value="${hex}">
        <input type="text" data-k="${esc(k)}" value="${esc(value)}" style="font-family:ui-monospace,monospace;">
      </div>`;
    }
    case "enum":
      return `<div class="ctrl"><select data-k="${esc(k)}">${ENUMS[key].map(o => `<option ${o===value?"selected":""}>${esc(o)}</option>`).join("")}</select></div>`;
    case "number": {
      const isPct = (section === "paint" && key.endsWith("-opacity"));
      const step = isPct ? 0.05 : 1;
      const min = isPct ? 0 : -100;
      const max = isPct ? 1 : 500;
      return `<div class="ctrl">
        <input type="range" data-k="${esc(k)}" min="${min}" max="${max}" step="${step}" value="${value}">
        <input type="number" data-k="${esc(k)}" value="${value}" style="width:64px;">
      </div>`;
    }
    case "bool":
      return `<div class="ctrl"><input type="checkbox" data-k="${esc(k)}" ${value?"checked":""}></div>`;
    case "array":
      return `<div class="ctrl"><input type="text" data-k="${esc(k)}" value="${esc(Array.isArray(value) ? value.join(", ") : value)}" placeholder="comma-separated"></div>`;
    case "expr":
      return `<div class="ctrl"><textarea data-k="${esc(k)}" spellcheck="false">${esc(JSON.stringify(value))}</textarea></div>`;
    default:
      return `<div class="ctrl"><input type="text" data-k="${esc(k)}" value="${esc(value)}"></div>`;
  }
}

function bindPropInputs() {
  $$(".prop [data-k]").forEach(el => {
    const [section, key] = el.dataset.k.split("__");
    const i = selectedIndex();
    if (i < 0) return;
    const l = style.layers[i];
    const target = (section === "paint") ? l.paint : l.layout;
    if (!target) return;

    const commit = (v, ok) => {
      if (ok) {
        target[key] = v;
        el.classList.remove("err");
        schedulePreview();
      } else {
        el.classList.add("err");
        status("Invalid value for " + key, "err");
      }
    };

    if (el.type === "color") {
      el.oninput = () => {
        const hex = el.value;
        const txt = el.parentElement.querySelector('input[type="text"]');
        if (txt) txt.value = hex;
        commit(hex, true);
      };
    } else if (el.type === "range") {
      el.oninput = () => { const n = Number(el.value); const pair = el.parentElement.querySelector('input[type="number"]'); if (pair) pair.value = n; commit(n, !isNaN(n)); };
    } else if (el.type === "number") {
      el.oninput = () => { const n = Number(el.value); const pair = el.parentElement.querySelector('input[type="range"]'); if (pair && !isNaN(n)) pair.value = n; commit(n, !isNaN(n)); };
    } else if (el.type === "checkbox") {
      el.onchange = () => commit(el.checked, true);
    } else if (el.tagName === "SELECT") {
      el.onchange = () => commit(el.value, true);
    } else if (el.tagName === "TEXTAREA") {
      el.oninput = () => {
        try { const v = JSON.parse(el.value); commit(v, true); }
        catch { el.classList.add("err"); status("Invalid expression JSON", "err"); }
      };
    } else { // text
      el.oninput = () => commit(el.value, true);
    }
  });

  $$(".prop .rm").forEach(btn => {
    btn.onclick = () => {
      const [section, key] = btn.dataset.rm.split(":");
      const i = selectedIndex();
      if (i < 0) return;
      const l = style.layers[i];
      const target = (section === "paint") ? l.paint : l.layout;
      if (target) delete target[key];
      renderSections();
      schedulePreview();
    };
  });
}

function addProp(section, key) {
  const i = selectedIndex();
  if (i < 0) return;
  const l = style.layers[i];
  if (!l[section]) l[section] = {};
  const def = (section === "paint" ? PAINT_DEFAULTS : LAYOUT_DEFAULTS)[key];
  l[section][key] = def ? deepCopy(def[0]) : defaultFor(section, key);
  renderSections();
  schedulePreview();
}

function defaultFor(section, key) {
  const ctl = (section === "paint" ? PAINT_DEFAULTS : LAYOUT_DEFAULTS)[key];
  if (ctl) return deepCopy(ctl[0]);
  if (key.endsWith("-color")) return "#888888";
  if (key.endsWith("-opacity")) return 1;
  if (ENUMS[key]) return ENUMS[key][0];
  return "";
}

/* ---------- layer ops ---------- */

function addLayer() {
  const types = ["background","fill","line","symbol","circle","raster","fill-extrusion"];
  const type = prompt("Layer type:", "fill");
  if (!type || !types.includes(type)) return;
  const id = prompt("Layer id:", "new_" + type + "_" + Date.now().toString(36));
  if (!id) return;
  const l = { id, type };
  if (type !== "background" && type !== "raster") l.source = Object.keys(style.sources || {})[0] || "protomaps";
  if (type !== "background" && type !== "raster") l["source-layer"] = "";
  style.layers.push(l);
  selectedLayerId = id;
  renderAll();
  schedulePreview();
  status("Added layer: " + id);
}
function duplicateLayer() {
  const i = selectedIndex();
  if (i < 0) return;
  const l = deepCopy(style.layers[i]);
  l.id = l.id + "_copy";
  style.layers.splice(i + 1, 0, l);
  selectedLayerId = l.id;
  renderAll();
  schedulePreview();
}
function deleteLayer() {
  const i = selectedIndex();
  if (i < 0) return;
  style.layers.splice(i, 1);
  selectedLayerId = style.layers[Math.min(i, style.layers.length - 1)]?.id ?? null;
  renderAll();
  schedulePreview();
  status("Deleted layer", "warn");
}
function moveLayer(dir) {
  const i = selectedIndex();
  const j = i + dir;
  if (i < 0 || j < 0 || j >= style.layers.length) return;
  [style.layers[i], style.layers[j]] = [style.layers[j], style.layers[i]];
  renderAll();
  schedulePreview();
}

/* ---------- render all ---------- */

function renderAll() {
  renderTopSettings();
  renderLayerList();
  renderLayerMeta();
  renderSections();
}

/* ---------- JSON modal ---------- */

function openJson() {
  if (!style) return;
  $("#jsonArea").value = JSON.stringify(style, null, 2);
  $("#jsonErr").textContent = "";
  $("#modal").classList.add("open");
  $("#jsonArea").oninput = () => {
    try { JSON.parse($("#jsonArea").value); $("#jsonErr").textContent = ""; }
    catch (e) { $("#jsonErr").textContent = e.message; }
  };
}
function applyJson() {
  try {
    const v = JSON.parse($("#jsonArea").value);
    if (!v || !Array.isArray(v.layers)) throw new Error("Missing layers array");
    if (!v.sources || typeof v.sources !== "object") throw new Error("Missing sources object");
    style = v;
    selectedLayerId = style.layers[0]?.id ?? null;
    renderAll();
    schedulePreview();
    $("#modal").classList.remove("open");
    status("Style applied from JSON");
  } catch (e) {
    $("#jsonErr").textContent = "Invalid style: " + e.message;
  }
}

/* ---------- export ---------- */

function copyJson() {
  const text = JSON.stringify(style, null, 2);
  navigator.clipboard.writeText(text).then(
    () => status("Copied to clipboard"),
    () => { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); status("Copied to clipboard"); }
  );
}
function downloadJson() {
  const blob = new Blob([JSON.stringify(style, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "custom-map-style.json";
  a.click();
  URL.revokeObjectURL(a.href);
  status("Downloaded custom-map-style.json");
}

/* ---------- load ---------- */

async function loadFromUrl(url) {
  status("Fetching " + url + "…");
  try {
    const res = await fetch(url);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const data = await res.json();
    setStyle(data, true);
    status("Loaded from URL: " + url);
  } catch (e) {
    status("Fetch failed (" + e.message + ") — using embedded default", "err");
    setStyle(deepCopy(defaultStyle), true);
  }
}
function resetToDefault() {
  setStyle(deepCopy(defaultStyle), true);
  status("Reset to embedded default");
}
function setStyle(newStyle, rebuild) {
  style = newStyle;
  selectedLayerId = style.layers[0]?.id ?? null;
  renderAll();
  if (rebuild) {
    if (mapReady) {
      try { map.setStyle(deepCopy(style)); } catch (e) { status("Style error: " + e.message, "err"); }
    }
  } else {
    schedulePreview();
  }
}

/* ---------- init ---------- */

function init() {
  defaultStyle = JSON.parse($("#default-style-json").textContent);
  style = deepCopy(defaultStyle);
  selectedLayerId = style.layers[0]?.id ?? null;

  try {
    map = new maplibregl.Map({
      container: $("#preview"),
      style: deepCopy(style),
      center: DEFAULT_CENTER,
      zoom: DEFAULT_ZOOM,
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "top-right");
    map.on("load", () => { mapReady = true; $("#empty").style.display = "none"; });
    map.on("error", (e) => { status("Map error: " + (e && e.error && e.error.message ? e.error.message : "unknown"), "err"); });
  } catch (e) {
    status("MapLibre init failed: " + e.message, "err");
    $("#empty").textContent = "MapLibre failed to load: " + e.message;
  }

  renderAll();
  status("Ready — editing embedded Protomaps dark style");

  $("#btnLoad").onclick = () => loadFromUrl(DEFAULT_STYLE_URL);
  $("#btnReset").onclick = resetToDefault;
  $("#btnJson").onclick = openJson;
  $("#jsonApply").onclick = applyJson;
  $("#modalClose").onclick = () => $("#modal").classList.remove("open");
  $("#modal").onclick = (e) => { if (e.target === $("#modal")) $("#modal").classList.remove("open"); };
  $("#btnCopy").onclick = copyJson;
  $("#btnDownload").onclick = downloadJson;
  $("#btnAdd").onclick = addLayer;
  $("#btnDup").onclick = duplicateLayer;
  $("#btnDel").onclick = deleteLayer;
  $("#btnUp").onclick = () => moveLayer(-1);
  $("#btnDown").onclick = () => moveLayer(1);
}

document.addEventListener("DOMContentLoaded", init);
</script>
</body>
</html>
