<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>360° Viewer</title>

    <!-- Pannellum -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"
    >

    <script
            src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js">
    </script>

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
        }

        #panorama {
            width: 100%;
            height: 100%;
        }

        #error {
            display: none;

            position: absolute;
            inset: 0;

            align-items: center;
            justify-content: center;

            color: white;
            font-family: sans-serif;
            font-size: 16px;

            background: #000;

            padding: 24px;
            text-align: center;

            z-index: 100;
        }
    </style>
</head>

<body>

<div id="panorama"></div>

<div id="error">
    No panorama URL provided.
</div>

<script>
    const params = new URLSearchParams(window.location.search);

    const imageUrl = params.get("url");

    if (!imageUrl) {

        document.getElementById("error").style.display = "flex";

    } else {

        pannellum.viewer("panorama", {

            type: "equirectangular",

            panorama: imageUrl,

            autoLoad: true,

            showControls: true,

            mouseZoom: true,

            draggable: true,

            keyboardZoom: true,

            compass: false,

            hfov: 100,

            minHfov: 30,

            maxHfov: 120,

            pitch: 0,

            yaw: 0
        });
    }
</script>

</body>
</html>
