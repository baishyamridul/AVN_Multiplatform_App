<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>360° Test</title>

    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"
    >

    <script
            src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js">
    </script>

    <style>
        html,
        body,
        #panorama {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            overflow: hidden;
            background: black;
        }
    </style>
</head>

<body>

<div id="panorama"></div>

<script>
    fetch("https://mridx.github.io/360img/config.json")
        .then(response => {
            if (!response.ok) {
                throw new Error(
                    `Config failed: ${response.status}`
                );
            }

            return response.json();
        })
        .then(config => {

            // Generated paths are relative to tiles/
<!--            config.multiRes.basePath = "imgtest3/";-->
            config.multiRes.basePath = "https://mridx.github.io/360img";

            config.autoLoad = true;

            pannellum.viewer(
                "panorama",
                config
            );
        })
        .catch(error => {
            console.error(
                "Panorama error:",
                error
            );
        });
</script>

</body>
</html>
